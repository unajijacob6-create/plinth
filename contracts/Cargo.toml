[workspace]
resolver = "2"
members = ["plinth", "mock-ft"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/unajijacob6-create/plinth"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
