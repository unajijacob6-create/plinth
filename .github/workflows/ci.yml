name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install cargo-near
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.23.0/cargo-near-installer.sh | sh
      - name: Build, immutability check, unit + sandbox tests
        run: bash contracts/test.sh
  tools-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run web:build
      - name: Site smoke test (phone + desktop, live testnet reads, receipts verified in the browser)
        run: |
          npx playwright install --with-deps chromium
          PLINTH_BASE=/ npm run web:build
          (PLINTH_BASE=/ npx vite preview web --port 4173 --strictPort &)
          sleep 3
          npm run test:web
      - name: Verify the recorded testnet fund from the chain
        run: npm run verify -- "$(node -p "require('./data/testnet-run.json').fund")" --network testnet
