[package]
name = "plinth-strategy-v1"
version = "1.0.0"
edition = "2021"

[lib]
name = "plinth_strategy_v1"
path = "src/lib.rs"

[[bin]]
name = "plinth-strategy-v1"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
bs58 = { version = "0.5", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false }

[target.'cfg(target_os = "wasi")'.dependencies]
wasi-http-client = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
